[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asteval>=1.0.10",
    "fastapi>=0.141.1",
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]

[project.scripts]
server = "server:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
